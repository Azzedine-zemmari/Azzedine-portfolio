<!doctype html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Theme: resolved before first paint from the stored preference or the OS
       setting, so the correct palette renders with no flash of the wrong
       theme. Also marks JS available (html.js) for the reveal styles below. -->
  <script>
    (function () {
      var el = document.documentElement;
      var theme = "dark";
      try {
        var stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") theme = stored;
        else if (window.matchMedia("(prefers-color-scheme: light)").matches)
          theme = "light";
      } catch (e) {}
      el.setAttribute("data-theme", theme);
      el.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#f4f1ea" : "#0a0a0b");

      // Locale: same idea — resolve the stored language before first paint so
      // the document language and writing direction are correct with no flash.
      var locale = "en";
      try {
        var storedLocale = localStorage.getItem("locale");
        if (storedLocale === "en" || storedLocale === "fr" || storedLocale === "ar")
          locale = storedLocale;
      } catch (e) {}
      el.setAttribute("data-locale", locale);
      el.setAttribute("lang", locale);
      el.setAttribute("dir", locale === "ar" ? "rtl" : "ltr");
    })();
  </script>

  <!-- Marks JS as available before first paint so reveal styles can hide
       content without a flash of unstyled content. If the app never boots,
       the flag is removed and all content becomes visible. -->
  <script>
    (function () {
      var el = document.documentElement;
      el.classList.add("js");
      window.addEventListener("load", function () {
        window.setTimeout(function () {
          if (!window.__portfolioReady) el.classList.remove("js");
        }, 1200);
      });
    })();
  </script>
